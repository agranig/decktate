# Copy to ~/.config/decktate/config.yaml. Everything here is optional.
# API keys go into ~/.config/decktate/.env:
#   DEEPGRAM_API_KEY=...      dictation (without it the MIC key is off)
#   ELEVENLABS_API_KEY=...    voice (without it the system voice is used)

port: 47873                   # hooks are served on 127.0.0.1:<port>; restart Decktate after changing it
brightness: 60
log_level: info               # info | debug: how much goes into activity.log (also switchable on the deck, under settings)
permission_hold_s: 120        # how long a request waits for a key before the terminal asks instead
auto_hooks: true              # add the hooks when Decktate starts, remove them when it quits
slash: ["/btw", "/compact", "/clear", "/review", "/context", "/usage", "/resume"]   # the "/" page, any number; /clear needs the confirm hold; /btw is asked by voice
mute_projects: []             # project paths that are never spoken, e.g. ["/Users/me/work/secret"]

speech:
  tts: auto                   # auto | elevenlabs | system | off
  voice_id: ""                # ElevenLabs voice; empty = the account's first voice (pick on the deck)
  tts_model: eleven_flash_v2_5
  stt_model: nova-3
  language: en                # en | de | multi
  speak_permissions: true     # read out what a permission request wants
  speak_on_stop: true         # read the first sentences of what Claude finished
  review_dictation: false     # true: show dictated text first and send it with a second tap
  speed: 1.2                  # talking speed (1.0 = normal); ElevenLabs allows 0.7 to 1.2
  keyterms: ["Claude", "refactor", "commit", "pull request", "pytest"]   # words dictation should get right

audio:
  input: ""                   # microphone name (part of it is enough); empty = system default
  output: ""                  # speaker name; empty = system default
  volume: 1.0
